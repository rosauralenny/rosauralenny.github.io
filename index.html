<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feliz Cumpleaños 23</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Configuración de Tailwind para soportar las clases personalizadas -->
  <script>
    tailwind.config = {
      theme: {
        extend: {}
      }
    }
  </script>

  <!-- Babel para transpilar React/JSX en el navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Mapa de importaciones (Import Maps) -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.2.0",
      "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
      "framer-motion": "https://esm.sh/framer-motion@10.16.4?deps=react@18.2.0",
      "canvas-confetti": "https://esm.sh/canvas-confetti@1.6.0",
      "lucide-react": "https://esm.sh/lucide-react@0.292.0?deps=react@18.2.0"
    }
  }
  </script>
</head>
<body class="bg-gradient-to-br from-pink-50 via-purple-50 to-rose-50 text-gray-800 antialiased">
  
  <!-- Contenedor principal donde React renderizará la app -->
  <div id="root"></div>

  <!-- Código Principal de la App -->
  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from 'react';
    import { createRoot } from 'react-dom/client';
    import { motion, AnimatePresence } from 'framer-motion';
    import confetti from 'canvas-confetti';
    import { 
      Heart, Star, Camera, Music, Play, Pause, PartyPopper, Menu, X, ChevronDown, 
      Plane, Sparkles, Target, Image as ImageIcon 
    } from 'lucide-react';

    // Datos configurables para la aplicación
    const NAV_LINKS = [
      { id: 'inicio', label: 'Inicio' },
      { id: 'mensaje', label: 'Mensaje' },
      { id: 'recuerdos', label: 'Recuerdos' },
      { id: 'historia', label: '23 Años' },
      { id: 'deseos', label: 'Deseos' },
      { id: 'celebrar', label: 'Celebrar' },
    ];

    const GALLERY_IMAGES = [
      // { url: 'https://images.unsplash.com/photo-1511895426328-dc8714191300?q=80&w=800&auto=format&fit=crop', text: 'Un momento para recordar' },
      // { url: 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?q=80&w=800&auto=format&fit=crop', text: 'Sonrisas que lo dicen todo' },
      // { url: 'https://images.unsplash.com/photo-1530103862676-de8892bc952f?q=80&w=800&auto=format&fit=crop', text: 'Un día inolvidable' },
      // { url: 'https://images.unsplash.com/photo-1520854221256-17451cc331bf?q=80&w=800&auto=format&fit=crop', text: 'Buenos momentos' },
      // { url: 'https://images.unsplash.com/photo-1496337589254-7e19d01cec44?q=80&w=800&auto=format&fit=crop', text: 'Historias que continúan' },
      // { url: 'https://images.unsplash.com/photo-1523580494863-6f3031224c94?q=80&w=800&auto=format&fit=crop', text: 'Aventuras compartidas' },
    ];

    const TIMELINE_DATA = [
      { year: '2003', title: 'El comienzo', desc: 'Comenzaba una historia que todavía tiene muchísimo por escribir.' },
      { year: 'Infancia', title: 'Primeras aventuras', desc: 'Descubriendo el mundo, aprendiendo y creando recuerdos inolvidables.' },
      { year: 'Adolescencia', title: 'Nuevos sueños', desc: 'Crecer también significa descubrir quién quieres ser y trazar tu propio camino.' },
      { year: 'Hoy', title: '23 años', desc: 'Un nuevo capítulo comienza aquí, lleno de posibilidades infinitas.' },
    ];

    const WISHES = [
      "Que tus 23 lleguen cargados de aventuras.",
      "Que nunca pierdas esa forma única de iluminar los lugares a los que llegas.",
      "Que cada día encuentres una nueva razón para celebrar.",
      "Que este nuevo año de vida supere todas tus expectativas.",
      "Que los sueños que hoy parecen lejanos mañana sean recuerdos cumplidos.",
      "Que tengas 365 oportunidades para crear algo increíble.",
      "Que nunca te falten amor, risas, salud y personas que hagan tus días especiales."
    ];

    const FUTURE_GOALS = [
      { icon: Plane, text: 'Nuevas aventuras' },
      { icon: Heart, text: 'Nuevos recuerdos' },
      { icon: Sparkles, text: 'Nuevos sueños' },
      { icon: Target, text: 'Nuevas metas' },
      { icon: PartyPopper, text: 'Nuevas celebraciones' },
      { icon: ImageIcon, text: 'Nuevos momentos' },
    ];

    const scrollToSection = (id) => {
      const element = document.getElementById(id);
      if (element) {
        element.scrollIntoView({ behavior: 'smooth' });
      }
    };

    const Section = ({ id, children, className = '' }) => (
      <section id={id} className={`py-20 px-6 md:px-12 max-w-6xl mx-auto ${className}`}>
        <motion.div
          initial={{ opacity: 0, y: 50 }}
          whileInView={{ opacity: 1, y: 0 }}
          viewport={{ once: true, margin: "-100px" }}
          transition={{ duration: 0.8, ease: "easeOut" }}
        >
          {children}
        </motion.div>
      </section>
    );

    const Navbar = () => {
      const [isOpen, setIsOpen] = useState(false);

      return (
        <nav className="fixed top-0 w-full z-50 bg-white/40 backdrop-blur-lg border-b border-white/50 shadow-sm transition-all duration-300">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="flex justify-between items-center h-16">
              <div className="flex-shrink-0 cursor-pointer" onClick={() => scrollToSection('inicio')}>
                <span className="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-pink-500 to-violet-500">
                  Feliz 23 🎉
                </span>
              </div>
              
              <div className="hidden md:flex space-x-8">
                {NAV_LINKS.map((link) => (
                  <button
                    key={link.id}
                    onClick={() => scrollToSection(link.id)}
                    className="text-gray-700 hover:text-pink-600 transition-colors font-medium text-sm uppercase tracking-wider"
                  >
                    {link.label}
                  </button>
                ))}
              </div>

              <div className="md:hidden flex items-center">
                <button onClick={() => setIsOpen(!isOpen)} className="text-gray-700 focus:outline-none">
                  {isOpen ? <X size={28} /> : <Menu size={28} />}
                </button>
              </div>
            </div>
          </div>

          <AnimatePresence>
            {isOpen && (
              <motion.div
                initial={{ opacity: 0, height: 0 }}
                animate={{ opacity: 1, height: 'auto' }}
                exit={{ opacity: 0, height: 0 }}
                className="md:hidden bg-white/90 backdrop-blur-xl border-b border-white/50 overflow-hidden"
              >
                <div className="px-4 pt-2 pb-4 space-y-1 flex flex-col">
                  {NAV_LINKS.map((link) => (
                    <button
                      key={link.id}
                      onClick={() => {
                        scrollToSection(link.id);
                        setIsOpen(false);
                      }}
                      className="block px-3 py-3 text-base font-medium text-gray-800 hover:bg-pink-50 hover:text-pink-600 rounded-xl transition-colors text-left"
                    >
                      {link.label}
                    </button>
                  ))}
                </div>
              </motion.div>
            )}
          </AnimatePresence>
        </nav>
      );
    };

    const Hero = () => {
      return (
        <section id="inicio" className="min-h-screen flex flex-col justify-center items-center relative overflow-hidden pt-20 px-6">
          <div className="absolute top-1/4 left-10 w-32 h-32 bg-pink-300 rounded-full mix-blend-multiply filter blur-2xl opacity-70 animate-blob"></div>
          <div className="absolute top-1/3 right-10 w-32 h-32 bg-purple-300 rounded-full mix-blend-multiply filter blur-2xl opacity-70 animate-blob animation-delay-2000"></div>
          <div className="absolute bottom-1/4 left-1/2 w-32 h-32 bg-rose-300 rounded-full mix-blend-multiply filter blur-2xl opacity-70 animate-blob animation-delay-4000"></div>

          <motion.div 
            className="text-center z-10 max-w-4xl mx-auto"
            initial={{ scale: 0.8, opacity: 0 }}
            animate={{ scale: 1, opacity: 1 }}
            transition={{ duration: 1, ease: "easeOut" }}
          >
            <p className="text-sm md:text-base font-semibold tracking-widest text-pink-500 uppercase mb-4">
              Un día especial merece una celebración especial
            </p>
            
            <h1 className="text-6xl md:text-8xl lg:text-[12rem] font-black leading-none tracking-tighter mb-6 text-transparent bg-clip-text bg-gradient-to-br from-pink-500 via-purple-500 to-rose-400 drop-shadow-sm">
              23
            </h1>
            
            <h2 className="text-3xl md:text-5xl font-bold text-gray-800 mb-6">
              ¡Hoy celebramos tus 23!
            </h2>
            <h3 className="text-3xl md:text-5xl font-bold text-gray-800 mb-6">
              Rosaura Lenny
            </h3>
            
            <p className="text-lg md:text-xl text-gray-600 mb-10 max-w-2xl mx-auto leading-relaxed">
              23 años de historias, momentos, sueños y muchas razones para sonreír.
            </p>
            
            <motion.button
              whileHover={{ scale: 1.05 }}
              whileTap={{ scale: 0.95 }}
              onClick={() => scrollToSection('mensaje')}
              className="bg-gradient-to-r from-pink-500 to-violet-500 text-white font-bold py-4 px-8 rounded-full shadow-lg shadow-pink-500/30 hover:shadow-pink-500/50 transition-all flex items-center gap-2 mx-auto"
            >
              Comenzar la celebración <PartyPopper size={20} />
            </motion.button>
          </motion.div>
          
          <motion.div 
            className="absolute bottom-10 animate-bounce cursor-pointer text-pink-400"
            onClick={() => scrollToSection('mensaje')}
            initial={{ opacity: 0 }}
            animate={{ opacity: 1 }}
            transition={{ delay: 2 }}
          >
            <ChevronDown size={40} />
          </motion.div>
        </section>
      );
    };

    const MessageSection = () => {
      return (
        <Section id="mensaje" className="text-center">
          <h2 className="text-4xl md:text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-violet-600 to-pink-500 mb-8">
            23 razones para celebrar
          </h2>
          <p className="text-lg md:text-xl text-gray-700 max-w-3xl mx-auto leading-relaxed mb-16">
            Hoy no solo celebramos un año más, celebramos todo lo que has vivido, aprendido, superado y disfrutado. Que este nuevo capítulo llegue lleno de aventuras, personas increíbles, sueños cumplidos y momentos que merezcan quedarse para siempre.
          </p>
          
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            {[
              "Que nunca te falten motivos para sonreír.",
              "Que tus sueños sean siempre más grandes que tus miedos.",
              "Hoy es un buen día para celebrar todo lo que eres."
            ].map((frase, index) => (
              <motion.div
                key={index}
                whileHover={{ y: -10 }}
                className="bg-white/60 backdrop-blur-md p-8 rounded-3xl shadow-xl shadow-pink-500/5 border border-white flex items-center justify-center text-center min-h-[150px]"
              >
                <p className="text-gray-800 font-medium text-lg">"{frase}"</p>
              </motion.div>
            ))}
          </div>
        </Section>
      );
    };

    const GallerySection = () => {
      return (
        <Section id="recuerdos">
          <div className="text-center mb-12">
            <h2 className="text-4xl md:text-5xl font-bold text-gray-800 mb-4">
              Momentos que merecen ser recordados <Camera className="inline-block text-pink-500 mb-1" size={36} />
            </h2>
            <p className="text-gray-600">Coleccionando instantes inolvidables.</p>
          </div>
          
          <div className="columns-1 sm:columns-2 lg:columns-3 gap-6 space-y-6">
            {GALLERY_IMAGES.map((img, index) => (
              <motion.div
                key={index}
                initial={{ opacity: 0, scale: 0.9 }}
                whileInView={{ opacity: 1, scale: 1 }}
                viewport={{ once: true }}
                transition={{ duration: 0.5, delay: index * 0.1 }}
                className="relative group overflow-hidden rounded-3xl break-inside-avoid shadow-lg"
              >
                <img src={img.url} alt={`Recuerdo ${index + 1}`} className="w-full h-auto object-cover transform transition-transform duration-700 group-hover:scale-110" />
                <div className="absolute inset-0 bg-gradient-to-t from-black/70 via-black/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end p-6">
                  <p className="text-white font-medium text-lg translate-y-4 group-hover:translate-y-0 transition-transform duration-300">
                    {img.text}
                  </p>
                </div>
              </motion.div>
            ))}
          </div>
        </Section>
      );
    };

    const TimelineSection = () => {
      return (
        <Section id="historia" className="relative">
          <div className="text-center mb-16">
            <h2 className="text-4xl md:text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-rose-400 to-orange-400 mb-4">
              23 años, miles de historias
            </h2>
          </div>

          <div className="max-w-3xl mx-auto relative">
            <div className="absolute left-4 md:left-1/2 top-0 bottom-0 w-1 bg-gradient-to-b from-pink-300 via-purple-300 to-rose-300 transform md:-translate-x-1/2 rounded-full"></div>

            {TIMELINE_DATA.map((item, index) => (
              <motion.div 
                key={index}
                initial={{ opacity: 0, x: index % 2 === 0 ? -50 : 50 }}
                whileInView={{ opacity: 1, x: 0 }}
                viewport={{ once: true, margin: "-50px" }}
                transition={{ duration: 0.6 }}
                className={`relative flex items-center justify-between mb-12 w-full ${index % 2 === 0 ? 'md:flex-row-reverse' : ''}`}
              >
                <div className="hidden md:block w-5/12"></div>
                
                <div className="absolute left-4 md:left-1/2 w-8 h-8 rounded-full bg-white border-4 border-pink-400 shadow-lg transform -translate-x-1/2 flex items-center justify-center z-10">
                  <div className="w-2 h-2 rounded-full bg-pink-500"></div>
                </div>

                <div className="w-full md:w-5/12 pl-12 md:pl-0">
                  <div className="bg-white/80 backdrop-blur-md p-6 rounded-3xl shadow-xl shadow-purple-500/5 border border-white hover:shadow-2xl transition-shadow duration-300">
                    <span className="text-pink-500 font-bold text-sm tracking-wider uppercase mb-1 block">{item.year}</span>
                    <h3 className="text-xl font-bold text-gray-800 mb-2">{item.title}</h3>
                    <p className="text-gray-600 leading-relaxed">{item.desc}</p>
                  </div>
                </div>
              </motion.div>
            ))}
          </div>
        </Section>
      );
    };

    const WishesSection = () => {
      return (
        <Section id="deseos" className="bg-white/30 rounded-[3rem] my-20 py-24">
          <div className="text-center mb-16">
            <h2 className="text-4xl md:text-5xl font-bold text-gray-800 mb-4">
              Deseos para este nuevo año ✨
            </h2>
          </div>

          <div className="flex flex-wrap justify-center gap-4">
            {WISHES.map((wish, index) => (
              <motion.div
                key={index}
                initial={{ opacity: 0, scale: 0.8 }}
                whileInView={{ opacity: 1, scale: 1 }}
                viewport={{ once: true }}
                whileHover={{ scale: 1.05, rotate: index % 2 === 0 ? 2 : -2 }}
                transition={{ duration: 0.4, delay: index * 0.1 }}
                className="bg-gradient-to-br from-white to-pink-50 p-6 rounded-2xl shadow-md border border-pink-100 max-w-sm flex-grow basis-full md:basis-[calc(50%-1rem)] lg:basis-[calc(33.333%-1rem)]"
              >
                <Star className="text-yellow-400 mb-3" fill="currentColor" size={24} />
                <p className="text-gray-700 font-medium text-lg leading-relaxed">{wish}</p>
              </motion.div>
            ))}
          </div>
        </Section>
      );
    };

    const FutureSection = () => {
      return (
        <Section id="futuro">
          <div className="text-center mb-16">
            <h2 className="text-3xl md:text-4xl font-bold text-gray-800 mb-4">
              Lo que viene después de los 23…
            </h2>
            <p className="text-xl text-pink-600 font-medium italic">"El mejor capítulo todavía está por escribirse."</p>
          </div>

          <div className="grid grid-cols-2 md:grid-cols-3 gap-6 max-w-4xl mx-auto">
            {FUTURE_GOALS.map((goal, index) => {
              const Icon = goal.icon;
              return (
                <motion.div
                  key={index}
                  whileHover={{ y: -5 }}
                  className="bg-white/70 backdrop-blur-sm p-6 rounded-3xl shadow-sm hover:shadow-lg border border-white flex flex-col items-center justify-center text-center gap-3 transition-all"
                >
                  <div className="bg-pink-100 p-4 rounded-full text-pink-500">
                    <Icon size={32} />
                  </div>
                  <span className="font-semibold text-gray-700">{goal.text}</span>
                </motion.div>
              );
            })}
          </div>
        </Section>
      );
    };

    const InteractiveSection = () => {
      const [isPlaying, setIsPlaying] = useState(false);

      const launchConfetti = () => {
        const duration = 3000;
        const end = Date.now() + duration;

        const frame = () => {
          confetti({
            particleCount: 5,
            angle: 60,
            spread: 55,
            origin: { x: 0 },
            colors: ['#ec4899', '#8b5cf6', '#f43f5e']
          });
          confetti({
            particleCount: 5,
            angle: 120,
            spread: 55,
            origin: { x: 1 },
            colors: ['#ec4899', '#8b5cf6', '#f43f5e']
          });

          if (Date.now() < end) {
            requestAnimationFrame(frame);
          }
        };
        frame();
      };

      return (
        <Section id="celebrar" className="text-center">
          <motion.div 
            className="bg-gradient-to-r from-pink-100 via-purple-100 to-rose-100 p-12 rounded-[3rem] shadow-xl border border-white relative overflow-hidden"
            whileInView={{ scale: [0.95, 1] }}
            transition={{ duration: 0.5 }}
          >
            <div className="absolute top-0 right-0 -mt-10 -mr-10 text-pink-200/50 transform rotate-45"><Star size={150} fill="currentColor"/></div>
            
            <h2 className="text-4xl md:text-5xl font-bold text-gray-800 mb-4 relative z-10">
              La celebración comienza ahora 🎂
            </h2>
            <p className="text-2xl text-gray-600 mb-10 relative z-10">¡Hoy es el día!</p>
            
            <div className="flex flex-col sm:flex-row justify-center items-center gap-6 relative z-10">
              <motion.button
                whileHover={{ scale: 1.05 }}
                whileTap={{ scale: 0.95 }}
                onClick={launchConfetti}
                className="bg-pink-500 hover:bg-pink-600 text-white font-bold py-4 px-8 rounded-full shadow-lg shadow-pink-500/40 transition-colors flex items-center gap-3 text-lg w-full sm:w-auto justify-center"
              >
                ¡Lanzar confeti! <PartyPopper />
              </motion.button>
              {/* 
              <motion.button
                whileHover={{ scale: 1.05 }}
                whileTap={{ scale: 0.95 }}
                onClick={() => setIsPlaying(!isPlaying)}
                className={`${isPlaying ? 'bg-purple-100 text-purple-600 border-purple-300' : 'bg-white text-gray-700 border-gray-200'} border-2 font-bold py-4 px-8 rounded-full shadow-md transition-colors flex items-center gap-3 text-lg w-full sm:w-auto justify-center`}
              >
                {isPlaying ? (
                   <><Pause size={20} /> Pausar música</>
                ) : (
                   <><Play size={20} /> Reproducir celebración</>
                )}
                <Music size={20} className={isPlaying ? 'animate-bounce' : ''} />
              </motion.button> */}
            </div>
          </motion.div>
        </Section>
      );
    };

    const FinalMessage = () => {
      return (
        <footer className="pt-20 pb-10 px-6 text-center overflow-hidden relative">
          <motion.div
            initial={{ opacity: 0, y: 50 }}
            whileInView={{ opacity: 1, y: 0 }}
            viewport={{ once: true }}
            transition={{ duration: 1 }}
            className="max-w-3xl mx-auto"
          >
            <h3 className="text-2xl md:text-3xl font-bold text-gray-700 mb-6">
              Por un año más de vida, sueños y aventuras.
            </h3>
            <p className="text-lg text-gray-600 mb-12 leading-relaxed">
              Que estos 23 sean solamente el comienzo de una etapa increíble. Sigue disfrutando, aprendiendo, soñando y creando recuerdos que algún día mirarás con una sonrisa.
            </p>
            
            <h1 className="text-5xl md:text-7xl lg:text-8xl font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-500 to-rose-500 mb-16 py-4">
              ¡Feliz cumpleaños 23! 🎂🎉✨
            </h1>

            <div className="flex items-center justify-center gap-2 text-sm text-gray-500 mt-20 border-t border-gray-200/50 pt-8">
              <span>Hecho con cariño para celebrar un día muy especial</span>
              <Heart size={16} className="text-pink-500" fill="currentColor" />
            </div>
          </motion.div>
        </footer>
      );
    };

    function Cumpleanos23() {
      useEffect(() => {
        const style = document.createElement('style');
        style.innerHTML = `
          @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
          }
          .animate-blob {
            animation: blob 7s infinite;
          }
          .animation-delay-2000 {
            animation-delay: 2s;
          }
          .animation-delay-4000 {
            animation-delay: 4s;
          }
          html {
            scroll-behavior: smooth;
          }
        `;
        document.head.appendChild(style);
        return () => document.head.removeChild(style);
      }, []);

      return (
        <div className="relative min-h-screen overflow-x-hidden font-sans">
          <Navbar />
          <main>
            <Hero />
            <MessageSection />
            <GallerySection />
            <TimelineSection />
            <WishesSection />
            <FutureSection />
            <InteractiveSection />
          </main>
          <FinalMessage />
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<Cumpleanos23 />);
  </script>
</body>
</html>
